<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Gift</title>
    <style>
        :root {
            --box-color: #ff6b6b;
            --ribbon-color: #ffd93d;
            --bg-color: #f7f1e3;
            --flower-center: #ffca28;
            --flower-petal: #f06292;
            
            /* Responsive sizing - scales based on viewport */
            --box-size: min(40vw, 40vh, 200px);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            perspective: 1000px;
            padding: 20px;
        }

        /* Container for the 3D Object */
        .scene {
            width: var(--box-size);
            height: var(--box-size);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(30deg);
            transition: transform 1s ease;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* The Box Container */
        .gift-box {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        /* Common face styles */
        .face {
            position: absolute;
            width: var(--box-size);
            height: var(--box-size);
            background: var(--box-color);
            border: 2px solid #e55039;
            box-sizing: border-box;
        }

        /* Box Faces Positioning */
        .front  { transform: translateZ(calc(var(--box-size) / 2)); }
        .back   { transform: translateZ(calc(var(--box-size) / -2)) rotateY(180deg); }
        .left   { transform: translateX(calc(var(--box-size) / -2)) rotateY(-90deg); }
        .right  { transform: translateX(calc(var(--box-size) / 2)) rotateY(90deg); }
        .bottom { transform: translateY(calc(var(--box-size) / 2)) rotateX(-90deg); }
        
        /* Ribbon Decoration (CSS Lines) */
        .face::before, .face::after {
            content: '';
            position: absolute;
            background: var(--ribbon-color);
        }
        .face::before { 
            width: calc(var(--box-size) * 0.15); 
            height: 100%; 
            left: 50%; 
            transform: translateX(-50%); 
        }
        .face::after { 
            width: 100%; 
            height: calc(var(--box-size) * 0.15); 
            top: 50%; 
            transform: translateY(-50%); 
        }

        /* --- LID (FIXED) --- */
        .lid {
            --open-angle: 0deg;
            position: absolute;
            width: calc(var(--box-size) * 1.05);
            height: calc(var(--box-size) * 1.05);
            left: 0.5px;
            top: calc(var(--box-size) / 2);
            transform-style: preserve-3d;
            transform-origin: 50% 50% calc(var(--box-size) / -2 * 1.05);
            transform: rotateX(calc(90deg + var(--open-angle))) translateZ(calc(var(--box-size) / 2 * 1.05));
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Lid surface */
        .lid-top {
            position: absolute;
            inset: 0;
            background: var(--box-color);
            border: 2px solid #d63031;
            box-sizing: border-box;
        }
        
        /* Ribbon on Lid */
        .lid-top::before {
            content: '';
            position: absolute;
            width: calc(var(--box-size) * 0.15);
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ribbon-color);
        }
        .lid-top::after {
            content: '';
            position: absolute;
            width: 100%;
            height: calc(var(--box-size) * 0.15);
            top: 50%;
            transform: translateY(-50%);
            background: var(--ribbon-color);
        }

        /* Open state */
        .scene.open .lid {
            --open-angle: -120deg;
        }

        /* The Hidden Content (Image + Flowers) */
        .content {
            position: absolute;
            width: calc(var(--box-size) * 0.9);
            height: calc(var(--box-size) * 1.25);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateY(-30deg);
            transform-style: preserve-3d;
            opacity: 0;
            transition: all 1s ease 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .person-image {
            width: calc(var(--box-size) * 0.75);
            height: calc(var(--box-size) * 0.75);
            object-fit: cover;
            border: min(5px, calc(var(--box-size) * 0.025)) solid white;
            border-radius: calc(var(--box-size) * 0.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: #fff;
            position: relative;
            z-index: 10;
        }

        /* Flowers Container */
        .flowers {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* SVG Flower Styling */
        .flower {
            position: absolute;
            width: calc(var(--box-size) * 0.2);
            height: calc(var(--box-size) * 0.2);
            opacity: 0;
            transform: scale(0);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .flower svg {
            width: 100%;
            height: 100%;
            fill: var(--flower-petal);
        }
        .flower svg circle {
            fill: var(--flower-center);
        }

        /* Flower Positions */
        .f1 { top: -10%; left: -10%; transition-delay: 1.1s; }
        .f2 { top: -15%; right: -5%; transition-delay: 1.2s; }
        .f3 { bottom: 32%; left: -12%; transition-delay: 1.3s; }
        .f4 { bottom: 28%; right: -12%; transition-delay: 1.4s; }
        .f5 { top: 50%; left: -17%; transition-delay: 1.5s; }

        /* --- Animation States --- */
        .scene.open .content {
            transform: translate(-40%, -80%) rotateY(0deg); 
            opacity: 1;
        }

        .scene.open .flower {
            opacity: 1;
            transform: scale(1.5) rotate(360deg);
        }

        /* Hover Hint */
        .gift-box:hover {
            transform: scale(1.02);
            transition: transform 0.3s;
        }
        
        .instruction {
            position: absolute;
            bottom: max(20px, 5vh);
            color: #555;
            font-size: clamp(1rem, 3vw, 1.2rem);
            opacity: 0.7;
            animation: pulse 2s infinite;
            transition: opacity 0.4s ease;
            text-align: center;
            padding: 0 10px;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* QUOTE CARD STYLING */
        .quote-card {
            position: absolute;
            bottom: max(20px, 5vh);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            max-width: 90%;
            width: min(500px, 90vw);
            background: white;
            border-radius: 15px;
            padding: clamp(15px, 4vw, 25px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            transition: opacity 0.6s ease 1.2s, transform 0.6s ease 1.2s;
            pointer-events: none;
        }

        .scene.open ~ .quote-card {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .scene.open ~ .instruction {
            opacity: 0;
        }

        .card-icon {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 10px;
        }

        .verse-text {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-style: italic;
            color: #333;
            margin: 15px 0;
            line-height: 1.6;
        }

        .verse-ref {
            display: block;
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #666;
            font-weight: bold;
            margin: 10px 0;
        }

        .divider {
            width: 60%;
            height: 2px;
            background: linear-gradient(to right, transparent, #ff6b6b, transparent);
            margin: 15px auto;
        }

        .personal-message {
            font-size: clamp(0.9rem, 2.2vw, 1.05rem);
            color: #444;
            margin: 15px 0;
            line-height: 1.5;
        }

        .signature {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: #d63031;
            margin-top: 15px;
            font-weight: bold;
        }

        .signature .name {
            color: #ff6b6b;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            :root {
                --box-size: min(50vw, 50vh, 180px);
            }
            
            body {
                perspective: 800px;
                padding: 10px;
            }

            .scene {
                transform: rotateX(-15deg) rotateY(25deg);
            }

            .quote-card {
                padding: 15px;
            }
        }

        /* Small mobile devices */
        @media (max-width: 480px) {
            :root {
                --box-size: min(60vw, 55vh, 160px);
            }
        }

        /* Very small devices or landscape mobile */
        @media (max-height: 500px) {
            :root {
                --box-size: min(35vw, 70vh, 150px);
            }
            
            .instruction {
                font-size: clamp(0.8rem, 2.5vw, 1rem);
                bottom: 10px;
            }
            
            .quote-card {
                font-size: clamp(0.8rem, 2vw, 0.95rem);
                bottom: 10px;
                padding: 12px;
            }
        }

        /* Large screens */
        @media (min-width: 1200px) {
            :root {
                --box-size: min(30vw, 30vh, 250px);
            }
        }

        /* Support for touch devices - remove hover effect */
        @media (hover: none) {
            .gift-box:hover {
                transform: none;
            }
        }

    </style>
</head>
<body>

    <div class="scene" id="giftBox">
        <div class="gift-box">
            <!-- Box Faces -->
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face left"></div>
            <div class="face right"></div>
            <div class="face bottom"></div>

            <!-- The Lid -->
            <div class="lid">
                <div class="lid-top"></div>
            </div>

            <!-- The Surprise Content -->
            <div class="content">
                <img src="download.jpg" alt="Surprise!" class="person-image" 
                     onerror="this.src='https://via.placeholder.com/150?text=Your+Photo';">
                
                <!-- Pretty Flowers -->
                <div class="flowers">
                    <div class="flower f1">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 50 C20 0 80 0 50 50 C80 0 100 50 50 50 C100 50 100 100 50 50 C100 100 20 100 50 50 C20 100 0 50 50 50 C0 50 20 0 50 50 Z" />
                            <circle cx="50" cy="50" r="15" />
                        </svg>
                    </div>
                    <div class="flower f2">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 50 C20 0 80 0 50 50 C80 0 100 50 50 50 C100 50 100 100 50 50 C100 100 20 100 50 50 C20 100 0 50 50 50 C0 50 20 0 50 50 Z" />
                            <circle cx="50" cy="50" r="15" />
                        </svg>
                    </div>
                    <div class="flower f3">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 50 C20 0 80 0 50 50 C80 0 100 50 50 50 C100 50 100 100 50 50 C100 100 20 100 50 50 C20 100 0 50 50 50 C0 50 20 0 50 50 Z" />
                            <circle cx="50" cy="50" r="15" />
                        </svg>
                    </div>
                    <div class="flower f4">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 50 C20 0 80 0 50 50 C80 0 100 50 50 50 C100 50 100 100 50 50 C100 100 20 100 50 50 C20 100 0 50 50 50 C0 50 20 0 50 50 Z" />
                            <circle cx="50" cy="50" r="15" />
                        </svg>
                    </div>
                    <div class="flower f5">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 50 C20 0 80 0 50 50 C80 0 100 50 50 50 C100 50 100 100 50 50 C100 100 20 100 50 50 C20 100 0 50 50 50 C0 50 20 0 50 50 Z" />
                            <circle cx="50" cy="50" r="15" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="instruction">Tap the box to open!</div>

    <!-- Quote Card - appears only when box opens -->
    <div class="quote-card">
        <div class="card-icon">👻</div>
        
        <blockquote class="verse-text">
            "...weeping may endure for a night, but joy cometh in the morning."
        </blockquote>
        
        <cite class="verse-ref">Psalm 30:5</cite>
        
        <div class="divider"></div>
        
        <div class="personal-message">
            <strong>Message:</strong> The pain is temporary. Better days are promised.
        </div>
        
        <div class="signature">
            Love lots, <span class="name">PAUL!</span> 💝
        </div>
    </div>

    <script>
        const box = document.getElementById('giftBox');
        box.addEventListener('click', () => {
            box.classList.toggle('open');
        });
    </script>
</body>
</html>
